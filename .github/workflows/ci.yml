name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      secure-registry:
        description: 'Harden-Runner secure-registry input'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Harden-Runner
        uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12.1-binding-summary
        with:
          egress-policy: audit
          secure-registry: ${{ inputs.secure-registry || 'false' }}

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with the version developers run locally so
          # --frozen-lockfile behaves identically in CI.
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bunx biome ci .

      - name: Typecheck
        working-directory: apps/cursor
        run: bun run typecheck
